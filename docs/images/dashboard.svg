<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- window -->
  <rect width="1280" height="760" rx="14" fill="#0f141a"/>
  <rect x="0.5" y="0.5" width="1279" height="759" rx="14" fill="none" stroke="#2a323d"/>
  <rect width="1280" height="40" rx="14" fill="#161c24"/>
  <rect y="26" width="1280" height="14" fill="#161c24"/>
  <circle cx="22" cy="20" r="6" fill="#ef4444"/><circle cx="42" cy="20" r="6" fill="#f59e0b"/><circle cx="62" cy="20" r="6" fill="#22c55e"/>
  <text x="640" y="25" text-anchor="middle" font-size="13" fill="#9ca3af">CaptionFlow Pro — localhost:8000</text>

  <!-- nav -->
  <rect y="40" width="1280" height="52" fill="#121820"/>
  <line x1="0" y1="92" x2="1280" y2="92" stroke="#2a323d"/>
  <text x="24" y="72" font-size="18" font-weight="700" fill="#f3f4f6">CaptionFlow <tspan fill="#22c55e">Pro</tspan></text>
  <g font-size="14" fill="#9ca3af">
    <rect x="210" y="54" width="104" height="26" rx="6" fill="#1e2630"/>
    <text x="262" y="72" text-anchor="middle" fill="#f3f4f6" font-weight="600">Dashboard</text>
    <text x="376" y="72" text-anchor="middle">Single Model</text>
    <text x="498" y="72" text-anchor="middle">Caption Monitor</text>
    <text x="624" y="72" text-anchor="middle">Engine Config</text>
    <text x="728" y="72" text-anchor="middle">Settings</text>
    <text x="804" y="72" text-anchor="middle">Logs</text>
  </g>
  <rect x="1106" y="56" width="150" height="24" rx="12" fill="#0f2a1c" stroke="#166534"/>
  <circle cx="1124" cy="68" r="4" fill="#22c55e"/>
  <text x="1188" y="73" text-anchor="middle" font-size="12" fill="#4ade80">CUDA · RTX A2000</text>

  <!-- stats row -->
  <g font-size="12">
    <rect x="24" y="112" width="296" height="84" rx="10" fill="#161c24" stroke="#2a323d"/>
    <text x="44" y="138" fill="#9ca3af">GPU</text>
    <text x="44" y="172" font-size="26" font-weight="700" fill="#f3f4f6">42%</text>
    <text x="120" y="172" fill="#9ca3af">5.8 / 12 GB VRAM</text>
    <rect x="44" y="182" width="256" height="5" rx="2.5" fill="#1e2630"/><rect x="44" y="182" width="108" height="5" rx="2.5" fill="#22c55e"/>

    <rect x="336" y="112" width="296" height="84" rx="10" fill="#161c24" stroke="#2a323d"/>
    <text x="356" y="138" fill="#9ca3af">CPU</text>
    <text x="356" y="172" font-size="26" font-weight="700" fill="#f3f4f6">11%</text>
    <text x="428" y="172" fill="#9ca3af">16 threads</text>
    <rect x="356" y="182" width="256" height="5" rx="2.5" fill="#1e2630"/><rect x="356" y="182" width="28" height="5" rx="2.5" fill="#38bdf8"/>

    <rect x="648" y="112" width="296" height="84" rx="10" fill="#161c24" stroke="#2a323d"/>
    <text x="668" y="138" fill="#9ca3af">Caption Delay</text>
    <text x="668" y="172" font-size="26" font-weight="700" fill="#f3f4f6">1.8 s</text>
    <text x="748" y="172" fill="#9ca3af">avg over last 60 s</text>
    <rect x="668" y="182" width="256" height="5" rx="2.5" fill="#1e2630"/><rect x="668" y="182" width="74" height="5" rx="2.5" fill="#f59e0b"/>

    <rect x="960" y="112" width="296" height="84" rx="10" fill="#161c24" stroke="#2a323d"/>
    <text x="980" y="138" fill="#9ca3af">Active Feeds</text>
    <text x="980" y="172" font-size="26" font-weight="700" fill="#f3f4f6">2 / 2</text>
    <text x="1056" y="172" fill="#9ca3af">EN · HI running</text>
    <rect x="980" y="182" width="256" height="5" rx="2.5" fill="#22c55e"/>
  </g>

  <!-- feed card template -->
  <!-- Feed 1 -->
  <rect x="24" y="216" width="608" height="520" rx="12" fill="#161c24" stroke="#2a323d"/>
  <text x="44" y="248" font-size="17" font-weight="700" fill="#f3f4f6">Feed 1 — English</text>
  <rect x="520" y="232" width="92" height="24" rx="12" fill="#0f2a1c" stroke="#166534"/>
  <circle cx="538" cy="244" r="4" fill="#22c55e"/>
  <text x="572" y="249" text-anchor="middle" font-size="12" fill="#4ade80">LIVE</text>
  <g font-size="12">
    <rect x="44" y="266" width="92" height="24" rx="6" fill="#1e2630"/><text x="90" y="282" text-anchor="middle" fill="#d1d5db">UDP</text>
    <text x="150" y="282" fill="#9ca3af">udp://239.1.1.10:5000</text>
  </g>
  <g font-size="12" fill="#9ca3af">
    <text x="44" y="320">Model</text><text x="200" y="320" fill="#e5e7eb">whisperx_large_v3</text>
    <text x="44" y="344">GPU / Device</text><text x="200" y="344" fill="#e5e7eb">cuda:0 · float16</text>
    <text x="44" y="368">Terminology</text><text x="200" y="368" fill="#e5e7eb">cricket_terms.txt · 1,240 terms</text>
    <text x="44" y="392">Processing</text><text x="200" y="392" fill="#e5e7eb">3 s chunks · VAD on</text>
  </g>
  <rect x="44" y="414" width="568" height="250" rx="8" fill="#0b0f14" stroke="#2a323d"/>
  <text x="60" y="438" font-size="11" fill="#6b7280" letter-spacing="1">LIVE CAPTIONS</text>
  <g font-family="Consolas, Menlo, monospace" font-size="14">
    <text x="60" y="468" fill="#6b7280">00:12:04</text><text x="140" y="468" fill="#9ca3af">Good length delivery outside off stump,</text>
    <text x="60" y="496" fill="#6b7280">00:12:07</text><text x="140" y="496" fill="#9ca3af">left alone by the batter.</text>
    <text x="60" y="524" fill="#6b7280">00:12:11</text><text x="140" y="524" fill="#9ca3af">Short ball now, pulled away</text>
    <text x="60" y="552" fill="#6b7280">00:12:14</text><text x="140" y="552" fill="#d1d5db">through square leg for FOUR!</text>
    <text x="60" y="580" fill="#6b7280">00:12:18</text><text x="140" y="580" fill="#e5e7eb">That takes the partnership past fifty.</text>
    <text x="60" y="608" fill="#6b7280">00:12:22</text><text x="140" y="608" fill="#f3f4f6">Required run rate now 7.4 an over</text>
    <rect x="404" y="595" width="9" height="17" fill="#22c55e"/>
  </g>
  <g font-size="13" font-weight="600">
    <rect x="44" y="684" width="110" height="34" rx="8" fill="#dc2626"/><text x="99" y="706" text-anchor="middle" fill="#fff">Stop</text>
    <rect x="166" y="684" width="130" height="34" rx="8" fill="#1e2630" stroke="#2a323d"/><text x="231" y="706" text-anchor="middle" fill="#d1d5db">Export SRT</text>
    <text x="612" y="706" text-anchor="end" font-weight="400" font-size="12" fill="#6b7280">RTF 0.21 · 1,284 lines</text>
  </g>

  <!-- Feed 2 -->
  <rect x="648" y="216" width="608" height="520" rx="12" fill="#161c24" stroke="#2a323d"/>
  <text x="668" y="248" font-size="17" font-weight="700" fill="#f3f4f6">Feed 2 — Hindi</text>
  <rect x="1144" y="232" width="92" height="24" rx="12" fill="#0f2a1c" stroke="#166534"/>
  <circle cx="1162" cy="244" r="4" fill="#22c55e"/>
  <text x="1196" y="249" text-anchor="middle" font-size="12" fill="#4ade80">LIVE</text>
  <g font-size="12">
    <rect x="668" y="266" width="92" height="24" rx="6" fill="#1e2630"/><text x="714" y="282" text-anchor="middle" fill="#d1d5db">UDP</text>
    <text x="774" y="282" fill="#9ca3af">udp://239.1.1.11:5000</text>
  </g>
  <g font-size="12" fill="#9ca3af">
    <text x="668" y="320">Model</text><text x="824" y="320" fill="#e5e7eb">whisper-hindi-ct2</text>
    <text x="668" y="344">GPU / Device</text><text x="824" y="344" fill="#e5e7eb">cuda:0 · int8_float16</text>
    <text x="668" y="368">Terminology</text><text x="824" y="368" fill="#e5e7eb">hindi_terms.txt · 410 terms</text>
    <text x="668" y="392">Processing</text><text x="824" y="392" fill="#e5e7eb">3 s chunks · VAD on</text>
  </g>
  <rect x="668" y="414" width="568" height="250" rx="8" fill="#0b0f14" stroke="#2a323d"/>
  <text x="684" y="438" font-size="11" fill="#6b7280" letter-spacing="1">LIVE CAPTIONS</text>
  <g font-family="Nirmala UI, Mangal, Noto Sans Devanagari, sans-serif" font-size="15">
    <text x="684" y="468" fill="#6b7280" font-family="Consolas, Menlo, monospace" font-size="14">00:12:04</text><text x="764" y="468" fill="#9ca3af">ऑफ स्टंप के बाहर गुड लेंथ गेंद,</text>
    <text x="684" y="496" fill="#6b7280" font-family="Consolas, Menlo, monospace" font-size="14">00:12:07</text><text x="764" y="496" fill="#9ca3af">बल्लेबाज़ ने छोड़ दिया।</text>
    <text x="684" y="524" fill="#6b7280" font-family="Consolas, Menlo, monospace" font-size="14">00:12:11</text><text x="764" y="524" fill="#9ca3af">शॉर्ट गेंद, और यह पुल शॉट</text>
    <text x="684" y="552" fill="#6b7280" font-family="Consolas, Menlo, monospace" font-size="14">00:12:14</text><text x="764" y="552" fill="#d1d5db">स्क्वेयर लेग पर चार रन!</text>
    <text x="684" y="580" fill="#6b7280" font-family="Consolas, Menlo, monospace" font-size="14">00:12:18</text><text x="764" y="580" fill="#e5e7eb">साझेदारी पचास के पार।</text>
    <text x="684" y="608" fill="#6b7280" font-family="Consolas, Menlo, monospace" font-size="14">00:12:22</text><text x="764" y="608" fill="#f3f4f6">अब आवश्यक रन रेट 7.4</text>
  </g>
  <g font-size="13" font-weight="600">
    <rect x="668" y="684" width="110" height="34" rx="8" fill="#dc2626"/><text x="723" y="706" text-anchor="middle" fill="#fff">Stop</text>
    <rect x="790" y="684" width="130" height="34" rx="8" fill="#1e2630" stroke="#2a323d"/><text x="855" y="706" text-anchor="middle" fill="#d1d5db">Export SRT</text>
    <text x="1236" y="706" text-anchor="end" font-weight="400" font-size="12" fill="#6b7280">RTF 0.18 · 1,197 lines</text>
  </g>
