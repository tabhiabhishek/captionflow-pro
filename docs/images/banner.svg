<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f141a"/>
      <stop offset="1" stop-color="#14202e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="18" fill="none" stroke="#2a323d"/>

  <!-- waveform -->
  <g fill="url(#accent)" opacity="0.9">
    <rect x="80"  y="146" width="8" height="28"  rx="4"/>
    <rect x="96"  y="126" width="8" height="68"  rx="4"/>
    <rect x="112" y="104" width="8" height="112" rx="4"/>
    <rect x="128" y="132" width="8" height="56"  rx="4"/>
    <rect x="144" y="92"  width="8" height="136" rx="4"/>
    <rect x="160" y="118" width="8" height="84"  rx="4"/>
    <rect x="176" y="140" width="8" height="40"  rx="4"/>
    <rect x="192" y="110" width="8" height="100" rx="4"/>
    <rect x="208" y="136" width="8" height="48"  rx="4"/>
    <rect x="224" y="150" width="8" height="20"  rx="4"/>
  </g>
  <!-- arrow to caption -->
  <path d="M252 160 h36" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M282 150 l12 10 l-12 10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- caption box -->
  <rect x="310" y="128" width="64" height="64" rx="10" fill="#161c24" stroke="#2a323d"/>
  <text x="342" y="170" text-anchor="middle" font-size="24" font-weight="700" fill="#e5e7eb">CC</text>

  <text x="420" y="150" font-size="60" font-weight="700" fill="#f3f4f6">CaptionFlow <tspan fill="url(#accent)">Pro</tspan></text>
  <text x="422" y="196" font-size="24" fill="#9ca3af">Real-time GPU speech-to-text captioning for live cricket broadcasts</text>

  <g font-size="15" font-weight="600">
    <rect x="422" y="226" width="118" height="32" rx="16" fill="#0f2a1c" stroke="#166534"/>
    <text x="481" y="247" text-anchor="middle" fill="#4ade80">WhisperX</text>
    <rect x="552" y="226" width="140" height="32" rx="16" fill="#0c2233" stroke="#075985"/>
    <text x="622" y="247" text-anchor="middle" fill="#7dd3fc">English · Hindi</text>
    <rect x="704" y="226" width="118" height="32" rx="16" fill="#2a1f0b" stroke="#92400e"/>
    <text x="763" y="247" text-anchor="middle" fill="#fbbf24">CEA-608</text>
    <rect x="834" y="226" width="86" height="32" rx="16" fill="#241433" stroke="#6b21a8"/>
    <text x="877" y="247" text-anchor="middle" fill="#d8b4fe">SRT</text>
    <rect x="932" y="226" width="126" height="32" rx="16" fill="#1e2630" stroke="#2a323d"/>
    <text x="995" y="247" text-anchor="middle" fill="#d1d5db">CUDA · GPU</text>
  </g>
</svg>
